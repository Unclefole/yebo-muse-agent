<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Yebo AP Agent architecture</title>
  <desc id="desc">Untrusted input (invoices and a spoken instruction) goes to Meta models, which read and audit the invoices, turn speech into text, and plan the payments. Trusted code builds the limits from the invoices, a human approves them once, and Yebo checks every payment: ALLOW, DENY or REQUIRE_APPROVAL. A table shows which model runs each step. By default: Muse Voice Transcribe for voice and Muse Spark 1.3 for everything else. In Open mode: Muse Spark Open (open weights, via Baseten) for voice, reading invoice images, the hidden-request check and planning; PDF invoices are still read by Muse Spark 1.3, because Baseten does not accept PDFs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a434b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #14191e; }
      .panel-title { font-size: 14px; font-weight: 700; }
      .box { fill: #ffffff; stroke-width: 1.5; }
      .label { font-size: 13px; }
      .strong { font-weight: 700; }
      .small { font-size: 11.5px; fill: #3a434b; }
      .edge { stroke: #3a434b; stroke-width: 1.5; fill: none; }
      .th { font-size: 12.5px; font-weight: 700; fill: #3a434b; }
      .cell { font-size: 13px; }
      .rule { stroke: #d0d7de; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="639" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Untrusted input -->
  <rect x="20" y="20" width="200" height="320" rx="12" fill="#fdecee" stroke="#e5484d" stroke-width="1.5"/>
  <text class="panel-title" x="120" y="46" text-anchor="middle">Untrusted input</text>
  <rect class="box" x="40" y="84" width="160" height="64" rx="8" stroke="#e5484d"/>
  <text class="label" x="120" y="111" text-anchor="middle"><tspan class="strong">Invoices</tspan><tspan x="120" dy="18">photos and PDFs</tspan></text>
  <rect class="box" x="40" y="232" width="160" height="64" rx="8" stroke="#e5484d"/>
  <text class="label" x="120" y="259" text-anchor="middle"><tspan class="strong">Spoken instruction</tspan><tspan x="120" dy="18">"pay this week's invoices"</tspan></text>

  <!-- Meta models -->
  <rect x="250" y="20" width="350" height="320" rx="12" fill="#eef3ff" stroke="#5b7fd6" stroke-width="1.5"/>
  <text class="panel-title" x="425" y="46" text-anchor="middle">Meta models</text>
  <text class="small" x="425" y="326" text-anchor="middle">which model runs each step: see the table below</text>
  <rect class="box" x="268" y="74" width="150" height="84" rx="8" stroke="#5b7fd6"/>
  <text class="label" x="343" y="101" text-anchor="middle"><tspan class="strong">Read and audit</tspan><tspan x="343" dy="18">reads invoices,</tspan><tspan x="343" dy="18">flags hidden requests</tspan></text>
  <rect class="box" x="268" y="232" width="150" height="64" rx="8" stroke="#5b7fd6"/>
  <text class="label" x="343" y="259" text-anchor="middle"><tspan class="strong">Voice</tspan><tspan x="343" dy="18">speech to text</tspan></text>
  <rect class="box" x="440" y="150" width="144" height="96" rx="8" stroke="#5b7fd6"/>
  <text class="label" x="512" y="177" text-anchor="middle"><tspan class="strong">Agent brain</tspan><tspan x="512" dy="18">plans with</tspan><tspan x="512" dy="18">tool calls,</tspan><tspan x="512" dy="18">proposes payments</tspan></text>

  <!-- Trusted: code and Yebo -->
  <rect x="680" y="20" width="300" height="320" rx="12" fill="#e6f9ef" stroke="#16a36a" stroke-width="1.5"/>
  <text class="panel-title" x="830" y="46" text-anchor="middle">Trusted: code and Yebo</text>
  <rect class="box" x="700" y="66" width="260" height="62" rx="8" stroke="#16a36a"/>
  <text class="label" x="830" y="92" text-anchor="middle"><tspan class="strong">Limits built from the invoices</tspan><tspan x="830" dy="18" class="small">payees · largest invoice · total · 15 min</tspan></text>
  <rect class="box" x="700" y="160" width="260" height="50" rx="8" stroke="#16a36a"/>
  <text class="label" x="830" y="190" text-anchor="middle"><tspan class="strong">A human approves the limits once</tspan></text>
  <rect class="box" x="700" y="242" width="260" height="78" rx="8" stroke="#16a36a"/>
  <text class="label" x="830" y="268" text-anchor="middle"><tspan class="strong">Yebo checks every payment</tspan><tspan x="830" dy="18">ALLOW · DENY · REQUIRE_APPROVAL</tspan><tspan x="830" dy="18" class="small">with the reason and a receipt ID</tspan></text>

  <!-- Edges -->
  <path class="edge" d="M200,116 H266" marker-end="url(#arrow)"/>
  <path class="edge" d="M200,264 H266" marker-end="url(#arrow)"/>
  <path class="edge" d="M418,264 H428 V222 H438" marker-end="url(#arrow)"/>
  <path class="edge" d="M418,138 H428 V174 H438" marker-end="url(#arrow)"/>
  <path class="edge" d="M418,94 H698" marker-end="url(#arrow)"/>
  <path class="edge" d="M584,174 H606 V116 H698" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text class="small" x="614" y="148" text-anchor="start">can only</text>
  <text class="small" x="614" y="162" text-anchor="start">narrow</text>
  <path class="edge" d="M584,226 H606 V282 H698" marker-end="url(#arrow)"/>
  <text class="small" x="614" y="254" text-anchor="start">each</text>
  <text class="small" x="614" y="268" text-anchor="start">payment</text>
  <path class="edge" d="M830,128 V158" marker-end="url(#arrow)"/>
  <path class="edge" d="M830,210 V240" marker-end="url(#arrow)"/>

  <!-- Which model runs each step -->
  <rect x="20" y="360" width="960" height="260" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="panel-title" x="40" y="388">Which model runs each step</text>
  <text class="th" x="40" y="418">Step</text>
  <text class="th" x="372" y="418">Default</text>
  <text class="th" x="640" y="418">Open mode (Muse Spark Open: open weights, via Baseten)</text>
  <line class="rule" x1="36" y1="428" x2="964" y2="428"/>
  <rect x="630" y="436" width="334" height="26" rx="6" fill="#f1ebff" stroke="#8a63d2"/>
  <text class="cell" x="40" y="454">Voice instruction</text>
  <text class="cell" x="372" y="454">Muse Voice Transcribe</text>
  <text class="cell strong" x="640" y="454">Muse Spark Open</text>
  <rect x="630" y="468" width="334" height="26" rx="6" fill="#f1ebff" stroke="#8a63d2"/>
  <text class="cell" x="40" y="486">Reading invoice images</text>
  <text class="cell" x="372" y="486">Muse Spark 1.3</text>
  <text class="cell strong" x="640" y="486">Muse Spark Open</text>
  <rect x="630" y="500" width="334" height="26" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text class="cell" x="40" y="518">Reading PDF invoices</text>
  <text class="cell" x="372" y="518">Muse Spark 1.3</text>
  <text class="cell" x="640" y="518">Muse Spark 1.3 (Baseten does not accept PDFs)</text>
  <rect x="630" y="532" width="334" height="26" rx="6" fill="#f1ebff" stroke="#8a63d2"/>
  <text class="cell" x="40" y="550">Hidden-request check (audit)</text>
  <text class="cell" x="372" y="550">Muse Spark 1.3</text>
  <text class="cell strong" x="640" y="550">Muse Spark Open</text>
  <rect x="630" y="564" width="334" height="26" rx="6" fill="#f1ebff" stroke="#8a63d2"/>
  <text class="cell" x="40" y="582">Planning and tool calls (agent brain)</text>
  <text class="cell" x="372" y="582">Muse Spark 1.3</text>
  <text class="cell strong" x="640" y="582">Muse Spark Open</text>
  <text class="small" x="40" y="614">Shaded: open weights. Open mode is 100% open weights only when a run has no PDF invoices.</text>
</svg>
